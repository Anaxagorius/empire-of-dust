    .scavenge-hit {
      transform-origin: 50%;
      animation: .16s cubic-bezier(.22, 1, .36, 1) scav-squash
    }

    @keyframes scav-squash {
      0% {
        transform: scale(1)
      }

      35% {
        transform: scale(.96, 1.04)
      }

      to {
        transform: scale(1)
      }
    }

    .pop-num {
      pointer-events: none;
      animation: .72s cubic-bezier(.22, 1, .36, 1) forwards pop-up
    }

    @keyframes pop-up {
      0% {
        opacity: 1;
        transform: translate(-50%)scale(.9)
      }

      to {
        opacity: 0;
        transform: translate(-50%, -48px)scale(1.05)
      }
    }

    .shake-root {
      animation: .22s ease-out trauma
    }

    @keyframes trauma {
      0% {
        transform: translate(0)
      }

      20% {
        transform: translate(-2px, 1px)rotate(-.2deg)
      }

      45% {
        transform: translate(2px, -1px)rotate(.15deg)
      }

      70% {
        transform: translate(-1px)
      }

      to {
        transform: translate(0)
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .scavenge-hit,
      .pop-num,
      .shake-root {
        animation: none
      }
